#:schema node_modules/wrangler/config-schema.json
name = "frontend"
compatibility_date = "2026-04-03"

[build]
command = 'cd frontend && printf "npmScopes:\n  fortawesome:\n    npmRegistryServer: https://npm.fontawesome.com/\n    npmAlwaysAuth: true\n    npmAuthToken: %s\n" "$FONTAWESOME_NPM_AUTH_TOKEN" > .yarnrc.yml && printf "@fortawesome:registry=https://npm.fontawesome.com/\n//npm.fontawesome.com/:_authToken=%s\n" "$FONTAWESOME_NPM_AUTH_TOKEN" > .npmrc && yarn install && yarn build'

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

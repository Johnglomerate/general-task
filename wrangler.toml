#:schema node_modules/wrangler/config-schema.json
name = "frontend"
compatibility_date = "2026-04-03"

[build]
command = 'cd frontend && echo "FONTAWESOME_NPM_AUTH_TOKEN length: ${#FONTAWESOME_NPM_AUTH_TOKEN}" && printf "@fortawesome:registry=https://npm.fontawesome.com/\n//npm.fontawesome.com/:_authToken=%s\n" "$FONTAWESOME_NPM_AUTH_TOKEN" > .npmrc && cat .npmrc && npm install --legacy-peer-deps && npm run build'

[assets]
directory = "./frontend/dist"

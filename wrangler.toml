#:schema node_modules/wrangler/config-schema.json
name = "frontend"
compatibility_date = "2026-04-03"

[build]
command = "cd frontend && echo '@fortawesome:registry=https://npm.fontawesome.com/' > .npmrc && echo '//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}' >> .npmrc && corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install && yarn build"

[assets]
directory = "./frontend/dist"

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title><%= htmlWebpackPlugin.options.MARKETING_META_TITLE %></title>
        <link rel="icon" href="/images/favicon.png" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
        <meta name="description" content="<%= htmlWebpackPlugin.options.MARKETING_META_DESCRIPTION %>" />
        <meta property="og:title" content="<%= htmlWebpackPlugin.options.MARKETING_META_TITLE %>" />
        <meta property="og:description" content="<%= htmlWebpackPlugin.options.MARKETING_SOCIAL_DESCRIPTION %>" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="/images/futureman.png" />
        <meta property="twitter:title" content="<%= htmlWebpackPlugin.options.MARKETING_META_TITLE %>" />
        <meta property="twitter:description" content="<%= htmlWebpackPlugin.options.MARKETING_SOCIAL_DESCRIPTION %>" />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body>
        <div id="root"></div>
        <div id="event-details-popup"></div>
    </body>
</html>

name: E2E Cypress

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_cypress: ${{ steps.cypress_check.outputs.has_cypress }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Configure FontAwesome registry
        working-directory: frontend
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"

      - name: Check for Cypress config
        id: cypress_check
        working-directory: frontend
        run: |
          if [ -f "cypress.json" ] || [ -f "cypress.config.js" ] || [ -f "cypress.config.ts" ] || [ -d "cypress" ]; then
            echo "has_cypress=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cypress=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cypress config/directory not found — skipping E2E tests"
          fi

      - name: Cypress install
        if: steps.cypress_check.outputs.has_cypress == 'true'
        uses: cypress-io/github-action@v6
        with:
          install-command: yarn install --frozen-lockfile
          working-directory: frontend
          runTests: false
          build: yarn build:test

      - name: Save build folder
        if: steps.cypress_check.outputs.has_cypress == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          if-no-files-found: error
          path: frontend/dist

  test:
    needs: build
    if: needs.build.outputs.has_cypress == 'true'
    runs-on: ubuntu-latest
    env:
      REACT_APP_API_BASE_URL: http://localhost:8080
      DB_NAME: test
    strategy:
      fail-fast: false
      matrix:
        # run copies of the current job in parallel
        containers: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.18'
      
      - name: Download the build folders
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: frontend/dist

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Spin up db
        working-directory: backend
        run: docker compose up -d

      - name: Start backend server
        working-directory: backend
        run: go run . &

      - name: Install dependencies
        working-directory: frontend
        run: npm i cypress@9.5.3 serve typescript @testing-library/cypress chance

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npx serve -s dist
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 60
          command: npx cypress run --parallel --record --config supportFile=cypress/support,integrationFolder=cypress/integration
        env: 
          CYPRESS_RECORD_KEY: 65dc874e-0eec-40c2-92a6-6353992fbbc7
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          api_url: http://localhost:8080

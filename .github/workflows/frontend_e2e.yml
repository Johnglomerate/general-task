name: E2E Cypress

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - "**"

jobs:
  mobile:
    name: Mobile shell acceptance (390x844)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Configure FontAwesome registry
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"

      # `build:test` uses webpack.dev.js, which bakes in the *development* API base URL
      # (http://localhost:8080 — see src/environment.ts). The spec stubs that origin, so the suite
      # needs no backend or database, and cannot reach api.generaltask.com.
      - name: Install and build
        run: |
          yarn install --frozen-lockfile
          yarn build:test

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npx serve -s dist -l 3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 90
          # Chrome rather than the bundled Electron: the spec emulates a touch pointer over CDP and
          # asserts the emulation took effect, so the browser needs to be the one CI intends.
          browser: chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

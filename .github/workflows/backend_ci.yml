name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.18"

      - name: Start MongoDB
        run: docker compose up -d

      - name: Wait for MongoDB to be ready
        run: sleep 5

      - name: Run tests
        run: ./runtests.sh

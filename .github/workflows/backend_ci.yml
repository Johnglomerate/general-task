name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Five identical jobs to reduce flakiness
  build_0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.18"
      - name: Start MongoDB
        run: docker compose up -d
      - name: Wait for MongoDB to be ready
        run: sleep 5
      - name: Run tests
        run: ./runtests.sh


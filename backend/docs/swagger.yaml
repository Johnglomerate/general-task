basePath: /
definitions:
  api.createTestUserParams:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
host: localhost:8080
info:
  contact:
    email: support@generaltask.com
    name: Support
  description: Making knowledge workers more productive
  termsOfService: https://generaltask.com/terms-of-service
  title: General Task API
  version: "0.1"
paths:
  /create_test_user/:
    post:
      consumes:
      - application/json
      description: Only works in the dev environment (will not work in prod)
      parameters:
      - description: test user params
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.createTestUserParams'
      produces:
      - application/json
      responses:
        "201":
          description: auth token
          schema:
            type: string
        "400":
          description: invalid params
          schema:
            type: string
        "401":
          description: non-dev environment
          schema:
            type: string
      summary: Creates a test user for use in local testing
      tags:
      - test
  /link/{service_name}/:
    get:
      consumes:
      - application/json
      description: First step in oauth verification
      parameters:
      - description: Source ID
        in: path
        name: service_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: URL redirect
          schema:
            type: string
        "404":
          description: service not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Redirects to link callback for that service
      tags:
      - auth
  /link/{service_name}/callback/:
    get:
      consumes:
      - application/json
      description: Callback for initial /link/ call
      parameters:
      - description: Source ID
        in: path
        name: service_name
        required: true
        type: string
      - description: OAuth Code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth State
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            type: string
        "400":
          description: invalid params
          schema:
            type: string
        "404":
          description: service not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Exchanges Oauth tokens using state and code
      tags:
      - auth
  /login/:
    get:
      consumes:
      - application/json
      description: Required for getting authToken to use authenticated endpoints
      parameters:
      - description: should use prompt
        in: query
        name: force_prompt
        type: string
      - description: should use deeplink
        in: query
        name: use_deeplink
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: URL redirect
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Begins General Task login process
      tags:
      - auth
  /login/callback/:
    get:
      consumes:
      - application/json
      description: Finished the logging in process
      parameters:
      - description: OAuth Code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth State
        in: query
        name: state
        required: true
        type: string
      - description: OAuth Scope
        in: query
        name: scope
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: URL redirect
          schema:
            type: string
        "400":
          description: invalid params
          schema:
            type: string
        "403":
          description: user not approved for use
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Begins General Task login process
      tags:
      - auth
  /logout/:
    post:
      consumes:
      - application/json
      description: Removes the internal token associated with the session
      parameters:
      - description: General Task auth token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Logs a user out of General Task
      tags:
      - auth
  /ping/:
    get:
      description: used to determine if server online
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Returns success
      tags:
      - utils
  /waitlist/:
    post:
      consumes:
      - application/json
      description: Used to keep track of interested parties
      parameters:
      - description: email
        in: body
        name: email
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: success
          schema:
            type: string
        "302":
          description: email already added
          schema:
            type: string
        "400":
          description: invalid params
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Adds email to our waitlist
      tags:
      - utils
swagger: "2.0"
